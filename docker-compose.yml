services:
  db:
    image: postgres:15-alpine
    container_name: consentlayer_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: consentlayer_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d consentlayer_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: consentlayer_app
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:password123@db:5432/consentlayer_db}
      - DEBUG=${DEBUG:-False}
      - DODO_WEBHOOK_SECRET=${DODO_WEBHOOK_SECRET}
      - DODO_PAYMENTS_API_KEY=${DODO_PAYMENTS_API_KEY}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: