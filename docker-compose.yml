version: '3.8'

services:
  # PostgreSQL Database Container
  db:
    image: postgres:15-alpine
    container_name: consentlayer_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: consentlayer_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d consentlayer_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Web Application Container
  web:
    build: .
    container_name: consentlayer_app
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      # Maps your local directory to the container for live-reloading code
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password123@db:5432/consentlayer_db
      - DEBUG=True
      - DODO_WEBHOOK_SECRET=whsec_test_secret_key
    depends_on:
      db:
        condition: service_healthy

volumes:
  # Ensures your database data isn't deleted when the container restarts
  postgres_data: