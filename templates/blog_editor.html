{% extends "base.html" %}

{% block content %}
<div class="max-w-4xl mx-auto space-y-6">
    <div class="border-b border-slate-200 pb-4">
        <h1 class="text-2xl font-bold text-slate-900">Blog Publisher Studio</h1>
        <p class="text-sm text-slate-500">Draft and submit DPDP compliance educational articles.</p>
    </div>

    <form class="space-y-4 bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Article Title</label>
            <input type="text" placeholder="e.g., Guide to DPDP Section 8 Technical Safeguards" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Slug / URL Path</label>
            <input type="text" placeholder="e.g., dpdp-section-8-technical-safeguards" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Content (HTML or Markdown)</label>
            <textarea rows="12" placeholder="Write article content here..." class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none font-mono text-sm"></textarea>
        </div>

        <button type="button" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg text-sm transition-colors">
            Submit Draft for Review
        </button>
    </form>
</div>
{% endblock %}
