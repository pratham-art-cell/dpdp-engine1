{% extends "base.html" %}

{% block title %}Blog Publisher Studio | ConsentLayer{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto space-y-4 sm:space-y-6">
    <div class="border-b border-slate-200 pb-3 sm:pb-4">
        <h1 class="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight">Blog Publisher Studio</h1>
        <p class="text-xs sm:text-sm text-slate-600 mt-1">Draft and publish DPDP compliance educational articles.</p>
    </div>

    <form class="space-y-4 bg-white p-5 sm:p-8 rounded-2xl sm:rounded-3xl border border-slate-200 shadow-sm">
        <div>
            <label for="post_title_input" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">Article Title</label>
            <input id="post_title_input" type="text" placeholder="e.g., Guide to DPDP Section 8 Technical Safeguards" class="w-full px-4 py-3 bg-[#fcfdfd] border border-slate-300 rounded-xl text-slate-900 text-sm focus:outline-none focus:border-indigo-600 transition-colors min-h-[44px]">
        </div>

        <div>
            <label for="post_slug_input" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">Slug / URL Path</label>
            <input id="post_slug_input" type="text" placeholder="e.g., dpdp-section-8-technical-safeguards" class="w-full px-4 py-3 bg-[#fcfdfd] border border-slate-300 rounded-xl text-slate-900 text-sm focus:outline-none focus:border-indigo-600 transition-colors min-h-[44px]">
        </div>

        <div>
            <label for="post_content_input" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">Content (HTML or Markdown)</label>
            <textarea id="post_content_input" rows="10" placeholder="Write article content here..." class="w-full px-4 py-3 bg-[#fcfdfd] border border-slate-300 rounded-xl text-slate-900 text-sm focus:outline-none focus:border-indigo-600 transition-colors font-mono"></textarea>
        </div>

        <div class="flex justify-center sm:justify-end pt-2">
            <button type="button" class="w-full sm:w-auto px-8 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs uppercase tracking-wider rounded-xl transition-all shadow-md min-h-[44px]">
                Publish Educational Article →
            </button>
        </div>
    </form>
</div>
{% endblock %}
