{% extends "base.html" %}
{% block content %}
<div class="max-w-4xl mx-auto space-y-4 sm:space-y-6">
    <div>
        <h1 class="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight">Account Settings</h1>
        <p class="text-slate-500 text-[11px] sm:text-sm mt-1">Manage clinic profile, contact records, and billing metadata.</p>
    </div>
    
    <div class="bg-white border border-slate-200 rounded-2xl sm:rounded-3xl p-5 sm:p-8 shadow-sm">
        <h3 class="text-base sm:text-lg font-bold text-slate-900 mb-1">Clinic Node Profile</h3>
        <p class="text-slate-500 text-[10px] sm:text-xs mb-5 sm:mb-6 break-all">Connected Account: <span class="text-indigo-600 font-semibold">{{ user_email }}</span></p>
        
        <div class="border-t border-slate-100 pt-5 sm:pt-6">
            <h3 class="text-sm sm:text-base font-bold text-slate-900 mb-3 sm:mb-4">Business Details</h3>
            
            <form hx-post="/settings/update" hx-target="#save-result" class="space-y-4 max-w-lg">
                <div>
                    <label class="block text-[10px] sm:text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">Full Name / Clinic Name</label>
                    <input type="text" name="full_name" value="{{ user_full_name | default('') }}" placeholder="e.g. Dr. Sharma Diagnostics" class="w-full bg-[#fcfdfd] border border-slate-200 rounded-xl px-4 py-3 sm:py-2.5 text-slate-800 text-xs sm:text-sm focus:outline-none focus:border-indigo-600 transition-colors">
                </div>
                
                <div>
                    <label class="block text-[10px] sm:text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">Mobile / Contact Number</label>
                    <input type="text" name="mobile" value="{{ user_mobile | default('') }}" placeholder="+91 98765 43210" class="w-full bg-[#fcfdfd] border border-slate-200 rounded-xl px-4 py-3 sm:py-2.5 text-slate-800 text-xs sm:text-sm focus:outline-none focus:border-indigo-600 transition-colors">
                </div>

                <div>
                    <label class="block text-[10px] sm:text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">Registered Address</label>
                    <textarea name="address" rows="3" placeholder="Full clinic address for GST billing..." class="w-full bg-[#fcfdfd] border border-slate-200 rounded-xl px-4 py-3 sm:py-2.5 text-slate-800 text-xs sm:text-sm focus:outline-none focus:border-indigo-600 transition-colors">{{ user_address | default('') }}</textarea>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full sm:w-auto px-6 py-3.5 sm:py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs uppercase tracking-wider rounded-xl transition-all shadow-md">
                        Save Profile Settings →
                    </button>
                </div>
                <div id="save-result"></div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
