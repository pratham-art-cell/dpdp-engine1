{% extends "base.html" %}
{% block content %}
<div class="max-w-4xl mx-auto">
    <h1 class="text-3xl font-semibold text-white tracking-tight mb-6">Account Settings</h1>
    
    <div class="bg-surface border border-border rounded-xl p-8 shadow-sm">
        <h3 class="text-xl font-bold text-white mb-4">Node Profile</h3>
        <p class="text-slate-400 mb-6">Connected Email: <span class="text-primary font-tech">{{ user_email }}</span></p>
        
        <div class="border-t border-border pt-6 mt-6">
            <h3 class="text-lg font-bold text-white mb-4">Business Details</h3>
            
            <form hx-post="/settings/update" hx-target="#save-result" class="space-y-4 max-w-md">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Full Name / Clinic Name</label>
                    <input type="text" name="full_name" value="{{ user_full_name | default('') }}" placeholder="e.g. Dr. Sharma Diagnostics" class="w-full bg-elevated border border-border rounded-lg px-4 py-2 text-white focus:outline-none focus:border-primary transition-colors">
                </div>
                
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Mobile / Contact Number</label>
                    <input type="text" name="mobile" value="{{ user_mobile | default('') }}" placeholder="+91 98765 43210" class="w-full bg-elevated border border-border rounded-lg px-4 py-2 text-white focus:outline-none focus:border-primary transition-colors">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Registered Address</label>
                    <textarea name="address" rows="3" placeholder="Full clinic address for billing..." class="w-full bg-elevated border border-border rounded-lg px-4 py-2 text-white focus:outline-none focus:border-primary transition-colors">{{ user_address | default('') }}</textarea>
                </div>

                <button type="submit" class="px-6 py-2 bg-primary hover:bg-primaryHover text-white font-medium rounded-lg transition-all shadow-lg shadow-primary/20">
                    Save Profile
                </button>
                <div id="save-result"></div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
