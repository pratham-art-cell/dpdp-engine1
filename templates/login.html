<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | DPDP Audit Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen p-4 sm:p-6">

    <div class="w-full max-w-md">
        <!-- Brand Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-indigo-600/10 border border-indigo-500/20 text-indigo-400 text-xl font-bold mb-4 shadow-inner">
                🔒
            </div>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">ConsentLayer</h1>
            <p class="text-xs sm:text-sm text-slate-400 mt-1">DPDP Section 33 Compliance & Audit Portal</p>
        </div>

        <!-- Auth Card -->
        <div class="bg-slate-900 border border-slate-800/80 rounded-3xl p-6 sm:p-8 shadow-2xl shadow-black/50 backdrop-blur-xl">
            
            <!-- Tab Switcher -->
            <div class="grid grid-cols-2 p-1 mb-6 bg-slate-950/60 rounded-xl border border-slate-800">
                <button type="button" id="tab-login-btn" onclick="setAuthTab('login')" 
                        class="py-2.5 text-xs sm:text-sm font-semibold rounded-lg transition-all duration-200 bg-indigo-600 text-white shadow-sm">
                    Sign In
                </button>
                <button type="button" id="tab-signup-btn" onclick="setAuthTab('signup')" 
                        class="py-2.5 text-xs sm:text-sm font-semibold rounded-lg transition-all duration-200 text-slate-400 hover:text-slate-200">
                    Create Account
                </button>
            </div>

            <!-- Login Form -->
            <form id="form-login" action="/login" method="POST" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Work Email</label>
                    <input type="email" name="email" required placeholder="name@clinic.com"
                           class="w-full px-4 py-3 bg-slate-950/50 border border-slate-800 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors">
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">Password</label>
                    </div>
                    <input type="password" name="password" required placeholder="••••••••"
                           class="w-full px-4 py-3 bg-slate-950/50 border border-slate-800 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors">
                </div>

                <button type="submit" 
                        class="w-full mt-2 py-3 px-4 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold rounded-xl shadow-lg shadow-indigo-600/25 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-slate-900">
                    Sign In to Portal
                </button>
            </form>

            <!-- Signup Form (Hidden by default) -->
            <form id="form-signup" action="/signup" method="POST" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Clinic / Work Email</label>
                    <input type="email" name="email" required placeholder="admin@clinic.com"
                           class="w-full px-4 py-3 bg-slate-950/50 border border-slate-800 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Create Master Password</label>
                    <input type="password" name="password" required placeholder="At least 8 characters" minlength="8"
                           class="w-full px-4 py-3 bg-slate-950/50 border border-slate-800 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors">
                </div>

                <button type="submit" 
                        class="w-full mt-2 py-3 px-4 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold rounded-xl shadow-lg shadow-emerald-600/25 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2 focus:ring-offset-slate-900">
                    Register New Tenant
                </button>
            </form>

        </div>

        <!-- Security Footer -->
        <p class="text-center text-xs text-slate-500 mt-6 flex items-center justify-center gap-1.5">
            <svg class="w-3.5 h-3.5 text-emerald-500 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
            </svg>
            256-bit Encrypted Session • Indian DPDP Act 2023 Compliant
        </p>
    </div>

    <script>
        function setAuthTab(tab) {
            const loginForm = document.getElementById('form-login');
            const signupForm = document.getElementById('form-signup');
            const loginBtn = document.getElementById('tab-login-btn');
            const signupBtn = document.getElementById('tab-signup-btn');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                loginBtn.className = 'py-2.5 text-xs sm:text-sm font-semibold rounded-lg transition-all duration-200 bg-indigo-600 text-white shadow-sm';
                signupBtn.className = 'py-2.5 text-xs sm:text-sm font-semibold rounded-lg transition-all duration-200 text-slate-400 hover:text-slate-200';
            } else {
                loginForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
                signupBtn.className = 'py-2.5 text-xs sm:text-sm font-semibold rounded-lg transition-all duration-200 bg-indigo-600 text-white shadow-sm';
                loginBtn.className = 'py-2.5 text-xs sm:text-sm font-semibold rounded-lg transition-all duration-200 text-slate-400 hover:text-slate-200';
            }
        }
    </script>
</body>
</html>
