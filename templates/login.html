<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConsentLayer — DPDP Compliance Portal</title>
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XDD5LY3XDH"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-XDD5LY3XDH');
    </script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white antialiased">

    <!-- Top Navigation Bar -->
    <header class="w-full border-b border-slate-800/80 bg-slate-950/60 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-600/30">
                    <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                    </svg>
                </div>
                <span class="font-bold tracking-tight text-lg text-white">Consent<span class="text-indigo-400">Layer</span></span>
            </div>
            <div class="flex items-center space-x-2 text-xs text-slate-400 bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-full">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>DPDP Act 2023 Compliant</span>
            </div>
        </div>
    </header>

    <!-- Main Auth Card Container -->
    <main class="flex-1 flex items-center justify-center px-4 py-12 relative overflow-hidden">
        <!-- Subtle Glow Effect -->
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-indigo-600/10 rounded-full blur-3xl pointer-events-none"></div>

        <div class="w-full max-w-md bg-slate-900/90 border border-slate-800/90 rounded-2xl p-8 shadow-2xl backdrop-blur-xl relative z-10">
            
            <!-- Auth Title -->
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold tracking-tight text-white">Welcome Back</h1>
                <p class="text-slate-400 text-sm mt-1">Manage employee consents and regulatory logs</p>
            </div>

            <!-- Tab Switcher -->
            <div class="grid grid-cols-2 bg-slate-950/80 p-1 rounded-xl border border-slate-800 mb-6 text-sm">
                <button type="button" id="tab-login" onclick="switchAuthTab('login')" class="py-2 rounded-lg font-medium text-white bg-slate-800 shadow transition-all duration-150">
                    Sign In
                </button>
                <button type="button" id="tab-signup" onclick="switchAuthTab('signup')" class="py-2 rounded-lg font-medium text-slate-400 hover:text-slate-200 transition-all duration-150">
                    Create Account
                </button>
            </div>

            <!-- Error / Notification Banner -->
            <div id="auth-alert" class="hidden mb-4 p-3 rounded-lg text-xs font-medium border"></div>

            <!-- Login Form -->
            <form id="login-form" action="/auth/login" method="POST" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5" for="login-email">Email Address</label>
                    <input type="email" id="login-email" name="email" required placeholder="admin@diagnostic-lab.in"
                           class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider" for="login-password">Password</label>
                    </div>
                    <input type="password" id="login-password" name="password" required placeholder="••••••••••••"
                           class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
                </div>

                <button type="submit" class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm rounded-xl shadow-lg shadow-indigo-600/25 transition-all duration-150 active:scale-[0.98] mt-2">
                    Access Dashboard
                </button>
            </form>

            <!-- Signup Form (Hidden by Default) -->
            <form id="signup-form" action="/auth/signup" method="POST" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5" for="signup-email">Business / Admin Email</label>
                    <input type="email" id="signup-email" name="email" required placeholder="admin@diagnostic-lab.in"
                           class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5" for="signup-password">Choose Password</label>
                    <input type="password" id="signup-password" name="password" required minlength="6" placeholder="At least 6 characters"
                           class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
                </div>

                <button type="submit" class="w-full py-2.5 px-4 bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-sm rounded-xl shadow-lg shadow-emerald-600/25 transition-all duration-150 active:scale-[0.98] mt-2">
                    Create Production Workspace
                </button>
            </form>

            <!-- Footer Meta Info -->
            <div class="mt-6 pt-6 border-t border-slate-800/80 text-center text-xs text-slate-500">
                <span>Encrypted with SHA-256 & Argon2</span>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full border-t border-slate-800/60 py-6 text-center text-xs text-slate-500">
        <p>© 2026 ConsentLayer. All rights reserved. Built for Indian Healthcare & Diagnostic Entities.</p>
    </footer>

    <!-- Interactive Script -->
    <script>
        function switchAuthTab(mode) {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            const tabLogin = document.getElementById('tab-login');
            const tabSignup = document.getElementById('tab-signup');

            if (mode === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                
                tabLogin.className = "py-2 rounded-lg font-medium text-white bg-slate-800 shadow transition-all duration-150";
                tabSignup.className = "py-2 rounded-lg font-medium text-slate-400 hover:text-slate-200 transition-all duration-150";
            } else {
                loginForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
                
                tabSignup.className = "py-2 rounded-lg font-medium text-white bg-slate-800 shadow transition-all duration-150";
                tabLogin.className = "py-2 rounded-lg font-medium text-slate-400 hover:text-slate-200 transition-all duration-150";
            }
        }
    </script>
</body>
</html>
