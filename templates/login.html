{% extends "base.html" %}

{% block title %}Clinic Login & Access Portal | ConsentLayer{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-8 sm:py-12">
    <div class="w-full bg-white border border-slate-200 rounded-2xl sm:rounded-3xl p-6 sm:p-10 shadow-xl">
        <div class="text-center mb-6">
            <span class="inline-block px-3 py-1 rounded-full bg-indigo-50 border border-indigo-200 text-indigo-700 text-xs font-bold uppercase tracking-wider mb-2">
                Clinic Portal
            </span>
            <h1 class="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight">
                ConsentLayer Auth
            </h1>
            <p class="text-slate-600 text-xs mt-1">Secure DPDP Section 8 Node</p>
        </div>

        <div class="grid grid-cols-2 bg-slate-100 p-1 rounded-xl mb-6 text-xs font-bold">
            <button type="button" id="tab-login" onclick="switchAuthTab('login')" class="py-2.5 rounded-lg bg-white text-indigo-600 shadow-sm transition-all min-h-[44px]">
                Sign In
            </button>
            <button type="button" id="tab-signup" onclick="switchAuthTab('signup')" class="py-2.5 rounded-lg text-slate-600 hover:text-slate-900 transition-all min-h-[44px]">
                Register
            </button>
        </div>

        <form id="login-form" action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5" for="login-email">Clinic / User Email</label>
                <input type="email" id="login-email" name="email" required placeholder="admin@diagnostic-lab.in"
                       class="w-full px-4 py-3 bg-[#fcfdfd] border border-slate-300 rounded-xl text-slate-900 text-sm focus:outline-none focus:border-indigo-600 transition-colors min-h-[44px]">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5" for="login-password">Access Password</label>
                <input type="password" id="login-password" name="password" required placeholder="••••••••••••"
                       class="w-full px-4 py-3 bg-[#fcfdfd] border border-slate-300 rounded-xl text-slate-900 text-sm focus:outline-none focus:border-indigo-600 transition-colors min-h-[44px]">
            </div>
            <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs uppercase tracking-wider rounded-xl shadow-lg hover:shadow-indigo-500/25 transition-all mt-2 min-h-[44px]">
                Authenticate Session →
            </button>
        </form>

        <form id="signup-form" action="/signup" method="POST" class="space-y-4 hidden">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5" for="signup-email">New Clinic Email</label>
                <input type="email" id="signup-email" name="email" required placeholder="admin@diagnostic-lab.in"
                       class="w-full px-4 py-3 bg-[#fcfdfd] border border-slate-300 rounded-xl text-slate-900 text-sm focus:outline-none focus:border-indigo-600 transition-colors min-h-[44px]">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5" for="signup-password">Set Password</label>
                <input type="password" id="signup-password" name="password" required minlength="8" placeholder="Min 8 characters"
                       class="w-full px-4 py-3 bg-[#fcfdfd] border border-slate-300 rounded-xl text-slate-900 text-sm focus:outline-none focus:border-indigo-600 transition-colors min-h-[44px]">
            </div>
            <button type="submit" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs uppercase tracking-wider rounded-xl shadow-lg hover:shadow-emerald-500/25 transition-all mt-2 min-h-[44px]">
                Provision Workspace →
            </button>
        </form>
        
        <div class="mt-6 pt-5 border-t border-slate-200 text-center">
            <span class="text-xs text-slate-600 font-medium">Cryptographic BCrypt Derivation • DPDP Section 8 Aligned</span>
        </div>
    </div>
</div>

<script>
    function switchAuthTab(mode) {
        const loginForm = document.getElementById('login-form');
        const signupForm = document.getElementById('signup-form');
        const tabLogin = document.getElementById('tab-login');
        const tabSignup = document.getElementById('tab-signup');

        if (mode === 'login') {
            loginForm.classList.remove('hidden');
            signupForm.classList.add('hidden');
            tabLogin.className = "py-2.5 rounded-lg bg-white text-indigo-600 shadow-sm transition-all min-h-[44px]";
            tabSignup.className = "py-2.5 rounded-lg text-slate-600 hover:text-slate-900 transition-all min-h-[44px]";
        } else {
            loginForm.classList.add('hidden');
            signupForm.classList.remove('hidden');
            tabSignup.className = "py-2.5 rounded-lg bg-white text-indigo-600 shadow-sm transition-all min-h-[44px]";
            tabLogin.className = "py-2.5 rounded-lg text-slate-600 hover:text-slate-900 transition-all min-h-[44px]";
        }
    }
</script>
{% endblock %}
