{% extends "base.html" %}

<!-- Disable Sidebar & Header for Login -->
{% block sidebar %}{% endblock %}
{% block topnav %}{% endblock %}
{% block content_margin %}pl-0{% endblock %}

{% block content %}
<div class="flex-1 flex flex-col items-center justify-center py-12 px-4 relative min-h-[85vh]">
    <!-- Tech Glow Effect -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[400px] h-[400px] bg-primary/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="w-full max-w-sm bg-surface border border-border rounded-xl p-8 shadow-2xl relative z-10">
        <!-- Logo -->
        <div class="flex justify-center mb-6">
            <div class="w-10 h-10 rounded bg-primary flex items-center justify-center shadow-lg shadow-primary/20">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 12l2 2 4-4"></path></svg>
            </div>
        </div>

        <div class="text-center mb-8">
            <h1 class="text-xl font-semibold tracking-tight text-white">ConsentLayer Auth</h1>
            <p class="text-slate-400 text-[10px] mt-1 font-tech uppercase tracking-wider">Secure Node Connection</p>
        </div>

        <!-- Tab Switcher -->
        <div class="grid grid-cols-2 bg-background p-1 rounded border border-border mb-6 text-[10px] font-tech uppercase">
            <button type="button" id="tab-login" onclick="switchAuthTab('login')" class="py-2 rounded bg-elevated text-white border border-border shadow-sm transition-all duration-150">
                Sign_In
            </button>
            <button type="button" id="tab-signup" onclick="switchAuthTab('signup')" class="py-2 rounded text-slate-500 hover:text-slate-300 transition-all duration-150">
                Register
            </button>
        </div>

        <div id="auth-alert" class="hidden mb-4 p-3 rounded-lg text-xs font-medium border font-tech"></div>

        <!-- Login Form (Action points to /login) -->
        <form id="login-form" action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-[10px] font-tech text-slate-500 mb-1.5" for="login-email">USER_EMAIL</label>
                <input type="email" id="login-email" name="email" required placeholder="admin@diagnostic-lab.in"
                       class="w-full px-3 py-2 bg-background border border-border rounded text-white font-tech text-xs focus:outline-none focus:border-primary transition-colors">
            </div>
            <div>
                <label class="block text-[10px] font-tech text-slate-500 mb-1.5" for="login-password">AUTH_KEY</label>
                <input type="password" id="login-password" name="password" required placeholder="••••••••••••"
                       class="w-full px-3 py-2 bg-background border border-border rounded text-white font-tech text-xs focus:outline-none focus:border-primary transition-colors">
            </div>
            <button type="submit" class="w-full py-2 bg-primary hover:bg-primaryHover text-white font-medium text-sm rounded transition-all mt-4">
                Authenticate
            </button>
        </form>

        <!-- Signup Form (Action points to /signup) with GTM Tracking Added -->
        <form id="signup-form" action="/signup" method="POST" onsubmit="window.dataLayer = window.dataLayer || []; window.dataLayer.push({'event': 'sign_up'});" class="space-y-4 hidden">
            <div>
                <label class="block text-[10px] font-tech text-slate-500 mb-1.5" for="signup-email">NEW_USER_EMAIL</label>
                <input type="email" id="signup-email" name="email" required placeholder="admin@diagnostic-lab.in"
                       class="w-full px-3 py-2 bg-background border border-border rounded text-white font-tech text-xs focus:outline-none focus:border-primary transition-colors">
            </div>
            <div>
                <label class="block text-[10px] font-tech text-slate-500 mb-1.5" for="signup-password">SET_AUTH_KEY</label>
                <input type="password" id="signup-password" name="password" required minlength="6" placeholder="Min 6 chars"
                       class="w-full px-3 py-2 bg-background border border-border rounded text-white font-tech text-xs focus:outline-none focus:border-primary transition-colors">
            </div>
            <button type="submit" class="w-full py-2 bg-success hover:bg-[#059669] text-white font-medium text-sm rounded transition-all mt-4">
                Provision Workspace
            </button>
        </form>
        
        <div class="mt-6 pt-6 border-t border-border text-center">
            <span class="text-[10px] font-tech text-slate-600">Encrypted via SHA-256</span>
        </div>
    </div>
</div>

<script>
    function switchAuthTab(mode) {
        const loginForm = document.getElementById('login-form');
        const signupForm = document.getElementById('signup-form');
        const tabLogin = document.getElementById('tab-login');
        const tabSignup = document.getElementById('tab-signup');

        if (mode === 'login') {
            loginForm.classList.remove('hidden');
            signupForm.classList.add('hidden');
            tabLogin.className = "py-2 rounded bg-elevated text-white border border-border shadow-sm transition-all duration-150";
            tabSignup.className = "py-2 rounded text-slate-500 hover:text-slate-300 transition-all duration-150";
        } else {
            loginForm.classList.add('hidden');
            signupForm.classList.remove('hidden');
            tabSignup.className = "py-2 rounded bg-elevated text-white border border-border shadow-sm transition-all duration-150";
            tabLogin.className = "py-2 rounded text-slate-500 hover:text-slate-300 transition-all duration-150";
        }
    }
</script>
{% endblock %}
