{% extends "base.html" %}

{% block layout_body %}
<div class="min-h-screen flex flex-col justify-between bg-[#fcfdfd] w-full">
    <!-- Header Navigation -->
    <header class="border-b border-slate-200 bg-white/90 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-5 h-16 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2 font-bold text-xl text-slate-900 tracking-tight">
                <span class="text-indigo-600">🛡️</span> Consent<span class="text-indigo-600">Layer</span>
            </a>
            <a href="/blog" class="text-sm font-semibold text-slate-600 hover:text-indigo-600 transition-colors">
                ← Compliance Library
            </a>
        </div>
    </header>

    <!-- Center Login Card -->
    <main class="flex-1 flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-md bg-white border border-slate-200 rounded-3xl p-8 sm:p-10 shadow-xl">
            <div class="text-center mb-6">
                <span class="inline-block px-3 py-1 rounded-full bg-indigo-50 border border-indigo-200 text-indigo-700 text-xs font-bold uppercase tracking-wider mb-2">
                    Clinic Portal
                </span>
                <h1 class="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight">
                    ConsentLayer Auth
                </h1>
                <p class="text-slate-500 text-xs mt-1">Secure DPDP Compliance Node</p>
            </div>

            <!-- Tab Switcher -->
            <div class="grid grid-cols-2 bg-slate-100 p-1 rounded-xl mb-6 text-xs font-bold">
                <button type="button" id="tab-login" onclick="switchAuthTab('login')" class="py-2 rounded-lg bg-white text-indigo-600 shadow-sm transition-all">
                    Sign In
                </button>
                <button type="button" id="tab-signup" onclick="switchAuthTab('signup')" class="py-2 rounded-lg text-slate-500 hover:text-slate-800 transition-all">
                    Register
                </button>
            </div>

            <!-- Login Form -->
            <form id="login-form" action="/login" method="POST" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5" for="login-email">Clinic / User Email</label>
                    <input type="email" id="login-email" name="email" required placeholder="admin@diagnostic-lab.in"
                           class="w-full px-4 py-3 bg-[#fcfdfd] border border-slate-200 rounded-xl text-slate-800 text-sm focus:outline-none focus:border-indigo-600 transition-colors">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5" for="login-password">Access Password</label>
                    <input type="password" id="login-password" name="password" required placeholder="••••••••••••"
                           class="w-full px-4 py-3 bg-[#fcfdfd] border border-slate-200 rounded-xl text-slate-800 text-sm focus:outline-none focus:border-indigo-600 transition-colors">
                </div>
                <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm uppercase tracking-wider rounded-xl shadow-lg hover:shadow-indigo-500/25 transition-all mt-2">
                    Authenticate Session →
                </button>
            </form>

            <!-- Signup Form -->
            <form id="signup-form" action="/signup" method="POST" onsubmit="window.dataLayer = window.dataLayer || []; window.dataLayer.push({'event': 'sign_up'});" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5" for="signup-email">New Clinic Email</label>
                    <input type="email" id="signup-email" name="email" required placeholder="admin@diagnostic-lab.in"
                           class="w-full px-4 py-3 bg-[#fcfdfd] border border-slate-200 rounded-xl text-slate-800 text-sm focus:outline-none focus:border-indigo-600 transition-colors">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5" for="signup-password">Set Password</label>
                    <input type="password" id="signup-password" name="password" required minlength="6" placeholder="Min 6 characters"
                           class="w-full px-4 py-3 bg-[#fcfdfd] border border-slate-200 rounded-xl text-slate-800 text-sm focus:outline-none focus:border-indigo-600 transition-colors">
                </div>
                <button type="submit" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm uppercase tracking-wider rounded-xl shadow-lg hover:shadow-emerald-500/25 transition-all mt-2">
                    Provision Workspace →
                </button>
            </form>
            
            <div class="mt-6 pt-5 border-t border-slate-100 text-center">
                <span class="text-xs text-slate-400">Encrypted via SHA-256 • DPDP Act 2023 Aligned</span>
            </div>
        </div>
    </main>

    <footer class="border-t border-slate-200 bg-white py-6 text-center text-xs text-slate-500">
        <p>© 2026 ConsentLayer Platform. Built for Indian Healthcare DPDP Compliance.</p>
    </footer>
</div>

<script>
    function switchAuthTab(mode) {
        const loginForm = document.getElementById('login-form');
        const signupForm = document.getElementById('signup-form');
        const tabLogin = document.getElementById('tab-login');
        const tabSignup = document.getElementById('tab-signup');

        if (mode === 'login') {
            loginForm.classList.remove('hidden');
            signupForm.classList.add('hidden');
            tabLogin.className = "py-2 rounded-lg bg-white text-indigo-600 shadow-sm transition-all";
            tabSignup.className = "py-2 rounded-lg text-slate-500 hover:text-slate-800 transition-all";
        } else {
            loginForm.classList.add('hidden');
            signupForm.classList.remove('hidden');
            tabSignup.className = "py-2 rounded-lg bg-white text-indigo-600 shadow-sm transition-all";
            tabLogin.className = "py-2 rounded-lg text-slate-500 hover:text-slate-800 transition-all";
        }
    }
</script>
{% endblock %}
