<!DOCTYPE html>
<html lang="en" class="bg-background">
<head>
    <!-- We try components first, then partials in case your folder structure varies -->
    {% include "components/meta.html" ignore missing %}
    {% include "partials/meta.html" ignore missing %}
    <title>ConsentLayer | DPDP Compliance</title>
</head>
<body class="text-slate-300 antialiased h-screen flex overflow-hidden">
    
    <!-- Sidebar -->
    <aside class="w-64 bg-surface border-r border-border flex-shrink-0 flex flex-col h-full z-20">
        <div class="p-6 border-b border-border">
            <a href="/" class="flex items-center gap-3">
                <img src="/static/consentlayer-logo.png" alt="ConsentLayer Icon" class="h-8 w-auto" />
                <span class="text-xl font-bold text-white tracking-tight">Consent<span class="text-primary">Layer</span></span>
            </a>
        </div>
        
        <nav class="p-4 space-y-2 flex-1 overflow-y-auto">
            <a href="/" class="block px-4 py-2.5 text-sm font-medium text-slate-300 hover:bg-elevated hover:text-white rounded-lg transition-colors">Dashboard</a>
            <a href="/reports" class="block px-4 py-2.5 text-sm font-medium text-slate-300 hover:bg-elevated hover:text-white rounded-lg transition-colors">Compliance Reports</a>
            <a href="/settings" class="block px-4 py-2.5 text-sm font-medium text-slate-300 hover:bg-elevated hover:text-white rounded-lg transition-colors">Settings</a>
            <a href="/support" class="block px-4 py-2.5 text-sm font-medium text-slate-300 hover:bg-elevated hover:text-white rounded-lg transition-colors">Support</a>
        </nav>
    </aside>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col h-full relative">
        <!-- Top Header Bar -->
        <header class="h-16 bg-surface border-b border-border flex items-center justify-between px-8 flex-shrink-0">
            <div class="flex items-center gap-2">
                <span class="px-2 py-1 bg-primary/10 text-primary border border-primary/20 rounded text-xs font-tech tracking-wider">DPDP SEC 33</span>
            </div>
            <div class="flex items-center gap-4">
                <span class="text-xs text-slate-400 font-tech">{{ user_email }}</span>
                <a href="/login" class="px-4 py-1.5 bg-elevated hover:bg-border text-white text-sm font-medium rounded transition-colors border border-border">Sign Out</a>
            </div>
        </header>

        <!-- Dynamic Page Content -->
        <main class="flex-1 overflow-y-auto p-8">
            {% block content %}{% endblock %}
        </main>
    </div>

</body>
</html>
