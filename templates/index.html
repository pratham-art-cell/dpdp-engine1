<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DPDP Compliance Engine</title>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Your Custom Stylesheet -->
    <link href="/static/styles.css" rel="stylesheet">
</head>

<body class="bg-gray-100 text-gray-900 p-8">
    <!-- Rest of your HTML remains exactly the same -->
     <!-- CSV Upload Section -->
        <!-- CSV Upload Section -->
        <div class="mt-12 border-t border-gray-200 pt-8">
            <h2 class="text-xl font-bold mb-4 text-gray-800">Run Offline CSV Audit</h2>
            <p class="text-sm text-gray-600 mb-6">Upload an exported clinic log to instantly calculate Section 33 liability.</p>
            
             <form hx-post="/labs/upload" hx-target="#audit-results" hx-encoding="multipart/form-data" class="flex items-center space-x-4">
                
                <!-- Tailwind Styled File Input -->
                <input type="file" name="audit_file" accept=".csv" required 
                       class="block w-full text-sm text-gray-500
                              file:mr-4 file:py-2 file:px-4
                              file:rounded-md file:border-0
                              file:text-sm file:font-semibold
                              file:bg-blue-50 file:text-blue-700
                              hover:file:bg-blue-100 cursor-pointer">
                
                <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-medium px-6 py-2 rounded-md shadow flex-shrink-0">
                    Analyze Logs
                </button>
                
            </form> <!-- The only closing tag belongs down here -->

            <!-- The generated report will appear inside this empty div -->
            <div id="audit-results" class="mt-8"></div>
        </div>
