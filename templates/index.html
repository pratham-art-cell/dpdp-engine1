<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DPDP Compliance Engine | Clinical Audit Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- Header / Navigation Bar -->
    <header class="bg-white border-b border-slate-200 shadow-xs">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold text-lg shadow-sm">
                    🔒
                </div>
                <span class="text-xl font-bold tracking-tight text-slate-900">ConsentLayer <span class="text-xs uppercase px-2 py-0.5 bg-indigo-50 text-indigo-700 rounded-full font-semibold ml-1">Clinical</span></span>
            </div>
            <div class="text-sm font-medium text-slate-600">
                Secure Tenant Portal
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-4xl mx-auto px-6 py-12 flex-grow w-full">
        
        <!-- Hero Section -->
        <div class="mb-8 text-center sm:text-left">
            <h1 class="text-3xl font-extrabold tracking-tight text-slate-900 sm:text-4xl">
                DPDP Section 33 Audit Portal
            </h1>
            <p class="mt-2 text-base text-slate-600">
                Upload your clinic transaction or consent logs to evaluate compliance and generate secure audit records instantly.
            </p>
        </div>

        <!-- Upload Card Container -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
            <form hx-post="/labs/upload" 
                  hx-target="#audit-results" 
                  hx-swap="innerHTML"
                  hx-encoding="multipart/form-data" 
                  enctype="multipart/form-data" 
                  hx-headers='{"X-API-Key": "dev_test_key_789"}'
                  class="space-y-6">
                
                <div class="space-y-2">
                    <label class="block text-sm font-semibold text-slate-700">
                        Upload Audit Log (.csv)
                    </label>
                    <div class="flex items-center justify-center w-full">
                        <label class="flex flex-col items-center justify-center w-full h-36 border-2 border-slate-300 border-dashed rounded-xl cursor-pointer bg-slate-50 hover:bg-slate-100 transition-colors">
                            <div class="flex flex-col items-center justify-center pt-5 pb-6 px-4 text-center">
                                <svg class="w-8 h-8 mb-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                                <p class="mb-2 text-sm text-slate-600"><span class="font-semibold">Click to upload</span> or drag and drop</p>
                                <p class="text-xs text-slate-500">CSV files containing Consent and Location records</p>
                            </div>
                            <input type="file" name="audit_file" accept=".csv" required class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer" />
                        </label>
                    </div>
                </div>

                <div class="flex justify-end">
                    <button type="submit" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm rounded-xl shadow-sm transition-all focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                        Analyze Compliance Logs
                    </button>
                </div>
            </form>
        </div>

        <!-- Target Container for HTMX Results -->
        <div id="audit-results" class="mt-8"></div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 mt-12">
        <div class="max-w-7xl mx-auto px-6 text-center text-xs text-slate-500">
            &copy; 2026 ConsentLayer Infrastructure. All rights reserved. Secured under DPDP Act protocols.
        </div>
    </footer>

</body>
</html>
